name: llt_action

on:
  workflow_call:
    inputs:
      image_version:
        required: true
        type: string

jobs:
  JOB_ut:
    name: UT
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          allow-unsafe-pr-checkout: true
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        identifier: process_download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: UT
        timeout-minutes: 30
        run: |
          set -ex
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          export pr_id=${{ env.MERGE_ID }}
          bash "$WORKSPACE/.gitcode/scripts/ut.sh"
    if: "${{ default() }}"
    runs-on: ['self-hosted','npu=2','smoke=204']
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}
