name: pre_smoke_action

on:
  workflow_call:
    inputs:
      image_version:
        required: true
        type: string

jobs:
  JOB_ut:
    name: UT
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/pre_smoke.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: pre_smoke
        identifier: pre_smoke
        uses: build-accelerate
        with:
          command: |
            set -ex
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            export pr_id=${{ env.MERGE_ID }}
            bash "$WORKSPACE/.gitcode/scripts/pre_smoke.sh"
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: "${{ steps.process_checkout.outputs.path }}/output/*"
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on: [self-hosted, arch=x64, spec=xlarge]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/ascend-catccos-dsl:9.2.0-950-py3.11-0.01
