[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "ascend-catccos-dsl"
version = "0.1.0"
description = "CATCCOS communication extensions for the Ascend Catlass TLA DSL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CANN Open Software License Agreement Version 2.0" }
dependencies = [
  "ascend-catlass-dsl",
  "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["catccos"]
pure-python = false

[tool.hatch.build.targets.wheel.force-include]
"csrc/mlir/build/python/catccos/tla_dist" = "catccos/tla_dist"

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
